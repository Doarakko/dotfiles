name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # テストは git rev-parse / git branch --show-current を読む。
      # checkout の既定は detached HEAD なので、ブランチ名を持たせる
      - name: Ensure a named branch
        run: git checkout -B ci-test

      - name: Validate plugin manifests
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
          jq empty .claude/settings.json

      # 検査は互いに独立しているので、1つ落ちても残りを走らせる。
      # 直列に止めると、最初の失敗が後続の回帰を隠す
      - name: hooks/pr-create-guard.test.sh
        if: ${{ !cancelled() }}
        run: bash hooks/pr-create-guard.test.sh

      - name: hooks/auto-review.test.sh
        if: ${{ !cancelled() }}
        run: bash hooks/auto-review.test.sh

      - name: scripts/validate-definitions.sh
        if: ${{ !cancelled() }}
        run: bash scripts/validate-definitions.sh
